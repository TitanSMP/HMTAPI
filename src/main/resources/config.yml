# HMT Network API Configuration

## HTTP server
# Changing any of these values requires a server restart. Everything below
# "endpoints" is applied by /hmtapi reload.
bind_address: "0.0.0.0"
#  ^^ The interface the API binds to. Use "127.0.0.1" to only allow local access.
port: 4567
#  ^^ The port the API runs on. Must be between 1 and 65535.
request_timeout_seconds: 5
#  ^^ How long a request may wait for the server thread before it is answered with
#     an error. Must be between 1 and 60.

## Formatting
# These values control how the built-in {last_login} and {last_seen} placeholders
# are rendered for player endpoints.
time_zone: "UTC"
#  ^^ Any valid Java time zone ID, e.g. "UTC", "Europe/Berlin" or "Europe/Berlin+02:00".
date_format: "yyyy/MM/dd HH:mm:ss"
#  ^^ Any valid java.time DateTimeFormatter pattern.
never_seen_value: "never"
#  ^^ Used instead of a date when a player has never joined this server.

## You can create custom endpoints here.
## INFO
##  require_player
##    If the endpoint requires a player. If you named the endpoint "hello", then the link will be "/api/hello/{username}" if it is set to true.
##    If true, the in-built placeholders "{username}", "{last_login}" and "{last_seen}" are available.
##    The format of "{last_login}" and "{last_seen}" is controlled by date_format and time_zone above.
##  object
##    The actual keys and values to be specified in the object.
##    You can have PlaceholderAPI placeholder values using "{papi:%placeholder%}".
endpoints:
  users:
    require_player: true
    object:
      username: "{username}"
      last_login: "{last_login}"
      balance: "{papi:%vault_eco_balance%}"

  global:
    require_player: false
    object:
      "server_name": "{papi:%server_name%}"
