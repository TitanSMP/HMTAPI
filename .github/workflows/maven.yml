name: Maven Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build HMTAPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B --batch-mode clean verify

      - name: Upload HMTAPI jar
        uses: actions/upload-artifact@v7
        with:
          name: HMTAPI
          path: target/HMTAPI-*.jar
          if-no-files-found: error
          retention-days: 30
